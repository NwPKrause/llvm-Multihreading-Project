name: Sync Upstream LLVM

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local branch
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with Upstream LLVM
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Ensure we are explicitly on local main branch
          git checkout -B main origin/main

          # 2. Add upstream repository
          git remote add upstream https://github.com/llvm/llvm-project.git || git remote set-url upstream https://github.com/llvm/llvm-project.git
          git fetch upstream main

          # 3. Hard reset local main to match upstream/main exactly (bypasses divergence)
          git reset --hard upstream/main

          # 4. Force push the clean upstream state to your fork
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
