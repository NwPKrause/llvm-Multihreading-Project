name: Sync Upstream LLVM

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write  # Required if syncing/modifying files in .github/workflows/

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Upstream Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Save local .github workflows before reset
          mkdir -p /tmp/github_backup
          cp -r .github/* /tmp/github_backup/ 2>/dev/null || true
          
          # Fetch upstream
          git remote add upstream https://github.com/llvm/llvm-project.git || git remote set-url upstream https://github.com/llvm/llvm-project.git
          git fetch upstream main --depth=100
          
          # Reset local main onto upstream main
          git checkout -B main upstream/main
          
          # Restore local .github directory
          mkdir -p .github
          cp -r /tmp/github_backup/* .github/ 2>/dev/null || true
          
          # Stage and commit changes
          git add .github/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "sync: upstream main"
          fi
          
          # Push to origin using environment credentials
          git push origin main --force
