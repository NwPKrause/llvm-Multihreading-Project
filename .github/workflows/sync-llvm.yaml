name: Sync Upstream LLVM

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Sync Upstream Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save this workflow file and any local GitHub workflows into memory before resetting
          mkdir -p /tmp/github_backup
          cp -r .github/* /tmp/github_backup/ 2>/dev/null || true

          # Fetch upstream
          git remote add upstream https://github.com/llvm/llvm-project.git || git remote set-url upstream https://github.com/llvm/llvm-project.git
          git fetch upstream main --depth=100

          # Hard reset local main directly onto upstream main (clean fast-forward)
          git checkout -B main upstream/main

          # Restore custom .github workflows on top of clean upstream
          mkdir -p .github
          cp -r /tmp/github_backup/* .github/ 2>/dev/null || true

          # Amend/Combine into a single clean commit or push clean branch state
          git add .github/
          if ! git diff-index --quiet HEAD --; then
            git commit --amend --no-edit || git commit -m "sync: upstream main"
          fi

          git push origin main --force
